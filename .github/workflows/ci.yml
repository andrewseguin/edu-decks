name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Unit Tests, Build & Visual Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Build
        run: pnpm -r build

      - name: Install Playwright Browsers
        run: pnpm --filter reading-deck exec playwright install --with-deps chromium

      - name: Start Next.js Development Servers
        run: |
          pnpm dev &
          npx wait-on http-get://127.0.0.1:9002 http-get://127.0.0.1:9003 --timeout 120000

      - name: Run Visual Regression Tests
        run: pnpm -r test:visual

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            apps/reading-deck/playwright-report/
            apps/reading-deck/test-results/
            apps/arithmetic-deck/playwright-report/
            apps/arithmetic-deck/test-results/
          retention-days: 7
