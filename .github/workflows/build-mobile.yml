name: Build Mobile Android & iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundles (AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: pnpm cap:sync

      - name: Build Arithmetic Deck Android
        working-directory: apps/arithmetic-deck/android
        run: ./gradlew assembleDebug bundleRelease

      - name: Build Reading Deck Android
        working-directory: apps/reading-deck/android
        run: ./gradlew assembleDebug bundleRelease

      - name: Upload Arithmetic Deck Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arithmetic-deck-android
          path: |
            apps/arithmetic-deck/android/app/build/outputs/bundle/release/*.aab
            apps/arithmetic-deck/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Reading Deck Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reading-deck-android
          path: |
            apps/reading-deck/android/app/build/outputs/bundle/release/*.aab
            apps/reading-deck/android/app/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS Native Projects
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor iOS
        run: pnpm cap:sync

      - name: Verify Arithmetic Deck iOS Project
        run: xcodebuild -project apps/arithmetic-deck/ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS' clean build CODE_SIGNING_ALLOWED=NO

      - name: Verify Reading Deck iOS Project
        run: xcodebuild -project apps/reading-deck/ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS' clean build CODE_SIGNING_ALLOWED=NO
